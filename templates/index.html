<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luca - Italy Chatbot</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── 전체 레이아웃 ── */
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111;
        }
        #app-container {
            /* 화면을 꽉 채움 — 태블릿/폰/PC 모두 */
            width: 100vw; height: 100dvh;   /* dvh = 모바일 주소창 제외 실제 높이 */
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        /* ── 배경 슬라이드쇼 ── */
        .bg-slideshow {
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
        }
        .bg-slideshow::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(10,10,15,0.38); z-index: 2;
        }
        .bg-slide {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0; animation: slideFade 24s infinite ease-in-out;
        }
        .slide1 { background-image: url('italy background 1.gif'); animation-delay: 0s; }
        .slide2 { background-image: url('italy background 2.gif'); animation-delay: 6s; }
        .slide3 { background-image: url('italy background 3.gif'); animation-delay: 12s; }
        .slide4 { background-image: url('italy background 4.gif'); animation-delay: 18s; }
        @keyframes slideFade {
            0%{opacity:0} 4%{opacity:1} 25%{opacity:1} 29%{opacity:0} 100%{opacity:0}
        }

        /* ── 캐릭터 영역 — 화면의 38% ── */
        #character-area {
            position: relative;
            flex: 0 0 38%;          /* 고정 비율 */
            min-height: 180px;
            display: flex; justify-content: center; align-items: flex-end;
            z-index: 3; padding-bottom: 8px;
        }
        #italy-flag-img {
            position: absolute; top: 12px; left: 14px;
            width: clamp(36px, 8vw, 56px); height: auto;
            border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.35); z-index: 4;
        }
        #luca-wrapper {
            position: relative;
            width:  clamp(110px, 22vw, 180px);
            height: clamp(140px, 28vw, 230px);
            animation: idle3D 4s ease-in-out infinite alternate;
        }
        @keyframes idle3D {
            0%   { transform: rotateY(-5deg) translateY(0); }
            100% { transform: rotateY(5deg)  translateY(-6px); }
        }
        #luca-character {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }
        .talking #luca-character { animation: bodyTalk 0.4s infinite alternate; }
        @keyframes bodyTalk { 0%{transform:scale(1)} 100%{transform:scale(1.05)} }

        /* ── 말풍선 (루카 발화) ── */
        #live-bubble {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
            padding: 10px 16px; border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 58%; max-width: 260px;
            text-align: center; font-size: clamp(13px,3.5vw,18px);
            font-weight: 700; color: #1d1d1f;
            z-index: 5; word-break: keep-all; pointer-events: none; display: none;
        }
        #live-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: rgba(255,255,255,0.96);
        }

        /* ── 채팅 히스토리 — 남은 공간 ── */
        #chat-history {
            flex: 1 1 0; min-height: 0;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
            z-index: 3;
            background: rgba(255,255,255,0.16); backdrop-filter: blur(8px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        #chat-history::-webkit-scrollbar { display: none; }
        .msg {
            max-width: 78%; padding: 10px 14px; border-radius: 16px;
            font-size: clamp(13px,3.5vw,16px); font-weight: 600;
            line-height: 1.4; word-break: break-word;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .msg.luca { align-self: flex-start; background: #fff; color: #1d1d1f; border-top-left-radius: 2px; }
        .msg.user { align-self: flex-end; background: #00b09b; color: #fff; border-top-right-radius: 2px; }

        /* ── 컨트롤 패널 ── */
        #control-panel {
            flex: 0 0 auto;
            background: rgba(16,16,20,0.94);
            padding: 12px 20px 16px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            z-index: 10; position: relative;  /* 팝업 기준점 */
        }
        #hint {
            color: #FFEB3B; font-size: clamp(12px,3.2vw,15px);
            font-weight: 600; text-align: center; line-height: 1.3;
        }
        #mic-btn {
            width: clamp(58px,14vw,70px); height: clamp(58px,14vw,70px);
            border-radius: 50%; border: none;
            background: linear-gradient(135deg,#ff416c,#ff4b2b);
            color: white; font-size: clamp(22px,6vw,28px);
            cursor: pointer; box-shadow: 0 6px 15px rgba(255,65,108,0.4);
            transition: all 0.2s; display: none;
        }
        #mic-btn.recording {
            background: linear-gradient(135deg,#11998e,#38ef7d);
            box-shadow: 0 0 25px rgba(56,239,125,0.7);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
        #start-btn {
            padding: 12px 40px; font-size: clamp(15px,4vw,18px); font-weight: 700;
            background: linear-gradient(135deg,#00b09b,#96c93d);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,176,155,0.4);
        }

        /* ── 노란 팝업 — 컨트롤 패널 바로 위 ── */
        #korean-popup {
            position: absolute;
            bottom: calc(100% + 6px);   /* 컨트롤 패널 위에 붙음 */
            left: 50%; transform: translateX(-50%) translateY(6px);
            background: #FFE066; color: #4a3700;
            padding: 10px 18px; border-radius: 14px;
            font-size: clamp(12px,3.2vw,14px); font-weight: 700;
            max-width: 88%; text-align: center; line-height: 1.4;
            box-shadow: 0 6px 16px rgba(0,0,0,0.28);
            z-index: 20;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: pre-wrap;
        }
        #korean-popup.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* ── 피날레 ── */
        #finale-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.78); z-index: 9998;
            justify-content: center; align-items: center;
        }
        #finale-overlay.show { display: flex; }
        #finale-msg {
            background: linear-gradient(135deg,#fff9e6,#fff);
            color: #2a2a2a; padding: 28px 24px; border-radius: 22px;
            font-size: clamp(16px,4.5vw,20px); font-weight: 800;
            text-align: center; line-height: 1.7;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            max-width: min(310px,88vw); border: 3px solid #FFD700; z-index: 9999;
        }
        .spark {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9997;
            animation: sparkFly 1.3s ease-out forwards;
        }
        @keyframes sparkFly {
            0%  { transform:translate(0,0) scale(1); opacity:1; }
            100%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
        }
    </style>
</head>
<body>

<!-- 로그인 오버레이 -->
<div id="login-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;justify-content:center;align-items:center;">
    <div style="background:#fff;padding:28px 24px;border-radius:16px;text-align:center;max-width:320px;width:88%;box-shadow:0 4px 20px rgba(0,0,0,0.35);">
        <h3 style="margin:0 0 10px;color:#222;font-size:20px;">🇮🇹 루카 챗봇 시작하기</h3>
        <p style="font-size:14px;color:#666;line-height:1.5;margin-bottom:14px;">수업 기록을 위해<br><b>학번과 이름</b>을 입력해주세요.<br>(예: 3101 홍길동)</p>
        <input type="text" id="student-name-input" placeholder="예: 3101 김민지"
            style="width:100%;padding:11px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;text-align:center;font-size:16px;">
        <button id="login-submit-btn"
            style="background:#00935b;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;font-weight:700;">
            등록하기 🚀
        </button>
    </div>
</div>

<!-- 피날레 -->
<div id="finale-overlay">
    <div id="finale-msg">🎉 이탈리아 친구와<br>대화해보다니!<br><br>참 잘했어요! 👏<br><br>다음 나라로 이동하세요.</div>
</div>

<div id="app-container">
    <div class="bg-slideshow">
        <div class="bg-slide slide1"></div>
        <div class="bg-slide slide2"></div>
        <div class="bg-slide slide3"></div>
        <div class="bg-slide slide4"></div>
    </div>

    <!-- 캐릭터 -->
    <div id="character-area">
        <img id="italy-flag-img" src="italy flag.gif" alt="Italy Flag">
        <div id="live-bubble">Click START! 👇</div>
        <div id="luca-wrapper">
            <img id="luca-character" src="OIP_Luca_paguro_png.PNG" alt="Luca">
        </div>
    </div>

    <!-- 채팅 -->
    <div id="chat-history"></div>

    <!-- 컨트롤 패널 (팝업 기준점) -->
    <div id="control-panel">
        <!-- 노란 팝업 — 컨트롤 패널 위에 뜸, 캐릭터 가리지 않음 -->
        <div id="korean-popup"></div>
        <div id="hint">Let's chat with Luca!</div>
        <button id="start-btn" onclick="startApp()">START (ITALY)</button>
        <button id="mic-btn">🎙️</button>
    </div>
</div>

<script>
    const liveBubble    = document.getElementById('live-bubble');
    const koreanPopup   = document.getElementById('korean-popup');
    const lucaWrapper   = document.getElementById('luca-wrapper');
    const chatHistory   = document.getElementById('chat-history');
    const hint          = document.getElementById('hint');
    const startBtn      = document.getElementById('start-btn');
    const micBtn        = document.getElementById('mic-btn');
    const finaleOverlay = document.getElementById('finale-overlay');

    let voices = [];
    let studentInfo = '';
    let conversationHistory = [];
    let stage = 'await_greeting';
    let popupTimer = null;   // 팝업 자동 숨김 타이머

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-submit-btn').onclick = () => {
            const val = document.getElementById('student-name-input').value.trim();
            if (!val) { alert('학번과 이름을 꼭 적어주세요! 😊'); return; }
            studentInfo = val;
            document.getElementById('login-overlay').style.display = 'none';
        };
    });

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined)
        window.speechSynthesis.onvoiceschanged = loadVoices;

    // ── 앱 시작 ─────────────────────────────────────────────
    function startApp() {
        startBtn.style.display = 'none';
        micBtn.style.display   = 'block';
        liveBubble.style.display = 'block';
        window.speechSynthesis.cancel();

        stage = 'await_greeting';
        const opening = "Hi! My name is Luca. Nice to meet you.";

        setTimeout(() => {
            addChatMessage('luca', opening);
            conversationHistory.push({ role: 'assistant', content: opening });
            speak(opening, () => {
                hint.innerText = "🎙️ 버튼을 누르고 루카에게 대답해보세요!";
                showKoreanPopup("루카에게 인사를 영어로 해주세요.");
            });
        }, 300);
    }

    // ── 팝업 표시 / 숨김 ────────────────────────────────────
    function showKoreanPopup(text) {
        clearTimeout(popupTimer);
        koreanPopup.innerText = '📢 ' + text;
        koreanPopup.classList.add('show');
    }
    function hideKoreanPopup() {
        clearTimeout(popupTimer);
        koreanPopup.classList.remove('show');
    }
    // 학생이 응답을 마치면 팝업 자연스럽게 숨김
    function scheduleHidePopup(delay = 600) {
        clearTimeout(popupTimer);
        popupTimer = setTimeout(hideKoreanPopup, delay);
    }

    // ── 채팅 메시지 추가 ────────────────────────────────────
    function addChatMessage(sender, text) {
        let t = text.trim();
        if (sender === 'user' && t.length > 0)
            t = t.charAt(0).toUpperCase() + t.slice(1);
        const el = document.createElement('div');
        el.classList.add('msg', sender);
        el.innerText = t;
        chatHistory.appendChild(el);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // ── TTS ─────────────────────────────────────────────────
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        liveBubble.innerText = text;
        const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
                          .replace(/\s{2,}/g, ' ').trim();
        const utt = new SpeechSynthesisUtterance(clean);
        utt.lang = 'en-US'; utt.rate = 0.8; utt.pitch = 1.45;
        if (voices.length > 0) {
            const v = voices.find(v => v.lang.startsWith('en') &&
                        (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google')))
                   || voices.find(v => v.lang.startsWith('en'));
            if (v) utt.voice = v;
        }
        lucaWrapper.classList.add('talking');
        utt.onend = () => {
            lucaWrapper.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utt);
    }

    // ── 폭죽 ────────────────────────────────────────────────
    function launchFireworks() {
        const colors = ['#FF4136','#FF851B','#FFDC00','#2ECC40','#0074D9','#B10DC9','#FF69B4','#fff'];
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 120; i++) {
            const s = document.createElement('div');
            s.classList.add('spark');
            const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 280;
            s.style.cssText = `left:${cx}px;top:${cy}px;
                width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                --tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;
                animation-delay:${Math.random()*0.4}s;
                animation-duration:${0.9+Math.random()*0.6}s;`;
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 2000);
        }
        [[cx*0.4,cy*0.6],[cx*1.6,cy*0.5],[cx,cy*1.3]].forEach(([x,y],i) => {
            setTimeout(() => {
                for (let j = 0; j < 50; j++) {
                    const s = document.createElement('div');
                    s.classList.add('spark');
                    const a = Math.random()*Math.PI*2, d = 60+Math.random()*160;
                    s.style.cssText = `left:${x}px;top:${y}px;
                        width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;
                        background:${colors[Math.floor(Math.random()*colors.length)]};
                        --tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;
                        animation-delay:${Math.random()*0.3}s;
                        animation-duration:${0.8+Math.random()*0.5}s;`;
                    document.body.appendChild(s);
                    setTimeout(() => s.remove(), 2000);
                }
            }, (i+1)*400);
        });
    }
    function showFinale() {
        [0, 800, 1600].forEach(d => setTimeout(launchFireworks, d));
        setTimeout(() => finaleOverlay.classList.add('show'), 600);
    }

    // ── 백엔드 API 호출 ────────────────────────────────────
    async function handleConversation(userInput) {
        // 학생이 응답하는 순간 팝업 숨김 예약 (자연스럽게)
        scheduleHidePopup(400);

        conversationHistory.push({ role: 'user', content: userInput });
        try {
            const res  = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student: studentInfo,
                    message: userInput,
                    history: conversationHistory,
                    stage:   stage
                })
            });
            const data = await res.json();

            conversationHistory.push({ role: 'assistant', content: data.reply });
            if (data.stage) stage = data.stage;

            addChatMessage('luca', data.reply);

            // 새 팝업이 있으면 표시, 없으면 숨김 유지
            if (data.popup) showKoreanPopup(data.popup);
            else            hideKoreanPopup();

            if (data.fireworks) {
                speak(data.reply, () => {
                    hint.innerText = '수고했어요! 🎉';
                    micBtn.style.display = 'none';
                    showFinale();
                });
            } else {
                speak(data.reply, () => {
                    hint.innerText = '🎙️ 버튼을 누르고 루카에게 대답해보세요!';
                });
            }

        } catch (err) {
            console.error('백엔드 연결 실패:', err);
            addChatMessage('luca', "Sorry, I missed that. Can you say it again?");
            speak("Sorry, I missed that.");
        }
    }

    // ── 음성 인식 ───────────────────────────────────────────
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
        const recognition = new SR();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.onclick = () => {
            try { recognition.start(); } catch(e) {}
            micBtn.classList.add('recording');
            hint.innerText = 'Listening... 👂 (듣고 있어요)';
        };
        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            addChatMessage('user', transcript);
            handleConversation(transcript);
        };
        recognition.onend = () => micBtn.classList.remove('recording');
        recognition.onerror = () => micBtn.classList.remove('recording');
    } else {
        alert('크롬 브라우저를 사용해주세요!');
    }
</script>
</body>
</html>
