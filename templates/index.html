<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luca - Elementary Small Talk Bot</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e24;
            display: flex; justify-content: center; align-items: center;
        }

        #app-container {
            width: 100%; max-width: 450px; height: 100%;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .bg-slideshow {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .bg-slideshow::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 20, 0.35);
            z-index: 2;
        }
        .bg-slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: slideFade 24s infinite ease-in-out;
        }
        .slide1 { background-image: url('italy background 1.gif'); animation-delay: 0s; }
        .slide2 { background-image: url('italy background 2.gif'); animation-delay: 6s; }
        .slide3 { background-image: url('italy background 3.gif'); animation-delay: 12s; }
        .slide4 { background-image: url('italy background 4.gif'); animation-delay: 18s; }

        @keyframes slideFade {
            0% { opacity: 0; }
            4% { opacity: 1; }
            25% { opacity: 1; }
            29% { opacity: 0; }
            100% { opacity: 0; }
        }

        #character-area {
            position: relative; width: 100%; height: 35vh; min-height: 220px;
            display: flex; justify-content: center; align-items: flex-end; z-index: 3;
            perspective: 1000px; padding-top: 20px;
        }

        #italy-flag-img {
            position: absolute; top: 15px; left: 15px;
            width: 50px; height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 4;
        }

        #luca-wrapper {
            position: relative; width: 140px; height: 180px;
            transform-style: preserve-3d; animation: idle3D 4s ease-in-out infinite alternate;
        }
        @keyframes idle3D {
            0% { transform: rotateY(-5deg) translateY(0px); }
            100% { transform: rotateY(5deg) translateY(-6px); }
        }
        #luca-character { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }
        .talking #luca-character { animation: bodyTalk 0.4s infinite alternate; }
        @keyframes bodyTalk { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        #live-bubble {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
            padding: 12px 18px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 55%; max-width: 240px; text-align: center; font-size: 18px; font-weight: 700; color: #1d1d1f;
            z-index: 5; word-break: keep-all; pointer-events: none; display: none;
        }
        #live-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.96) transparent;
        }

        #chat-history {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            z-index: 3; box-sizing: border-box;
            background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(8px);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #chat-history::-webkit-scrollbar { display: none; }

        .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .msg.luca { align-self: flex-start; background: #ffffff; color: #1d1d1f; border-top-left-radius: 2px; }
        .msg.user { align-self: flex-end; background: #00b09b; color: #ffffff; border-top-right-radius: 2px; }

        #control-panel {
            background: rgba(20, 20, 25, 0.92); padding: 20px; text-align: center; color: white;
            box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #hint { color: #FFEB3B; font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
        
        #mic-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; font-size: 28px; cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4); transition: all 0.2s; display: none;
        }
        #mic-btn.recording { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 0 25px rgba(56, 239, 125, 0.7); animation: pulse 1.4s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #start-btn {
            padding: 14px 45px; font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #00b09b, #96c93d); color: white; border: none;
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(0, 176, 155, 0.4);
        }

        /* 🇰🇷 한글 안내 팝업: 절대 음성으로 읽지 않고, 화면에만 표시되는 미션 안내문 */
        #korean-popup {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: #FFE066; color: #4a3700; padding: 12px 20px; border-radius: 16px;
            font-size: 14px; font-weight: 700; max-width: 82%; text-align: center; line-height: 1.4;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3); z-index: 8;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #korean-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; text-align:center; max-width:320px; width:85%; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <h3 style="margin-top:0; color:#222; font-size:20px;">🇮🇹 루카 챗봇 시작하기</h3>
            <p style="font-size:14px; color:#666; line-height:1.4;">반갑습니다! 수업 기록을 위해<br><b>학번과 이름</b>을 입력해주세요.<br>(예: 30101 홍길동)</p>
            <input type="text" id="student-name-input" placeholder="예: 3101 김민지" style="width:90%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px; text-align:center; font-size:16px;">
            <button id="login-submit-btn" style="background:#00935b; color:white; border:none; padding:12px 20px; border-radius:8px; font-size:16px; cursor:pointer; width:98%; font-weight:bold;">등록하기 🚀</button>
        </div>
    </div>

    <div id="app-container">
        <div class="bg-slideshow">
            <div class="bg-slide slide1"></div>
            <div class="bg-slide slide2"></div>
            <div class="bg-slide slide3"></div>
            <div class="bg-slide slide4"></div>
        </div>

        <div id="character-area">
            <img id="italy-flag-img" src="italy flag.gif" alt="Italy Flag">

            <div id="korean-popup"></div>
            <div id="live-bubble">Click START! 👇</div>
            <div id="luca-wrapper">
                <img id="luca-character" src="OIP_Luca_paguro_png.PNG" alt="Luca">
            </div>
        </div>

        <div id="chat-history"></div>

        <div id="control-panel">
            <div id="hint">Let's chat with Luca!</div>
            <button id="start-btn" onclick="startApp()">START (ITALY)</button>
            <button id="mic-btn">🎙️</button>
        </div>
    </div>

<script>
    const liveBubble = document.getElementById('live-bubble');
    const koreanPopup = document.getElementById('korean-popup');
    const lucaWrapper = document.getElementById('luca-wrapper');
    const chatHistory = document.getElementById('chat-history');
    const hint = document.getElementById('hint');
    const startBtn = document.getElementById('start-btn');
    const micBtn = document.getElementById('mic-btn');

    let voices = [];
    let studentInfo = "";
    let conversationHistory = []; // {role: 'user'|'assistant', content: string}[]
    let stage = 'await_feeling';  // 백엔드와 동일한 단계 값을 추적

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-submit-btn').onclick = () => {
            const nameInput = document.getElementById('student-name-input').value.trim();
            if(nameInput === "") {
                alert("학번과 이름을 꼭 적어주세요! 😊");
                return;
            }
            studentInfo = nameInput;
            document.getElementById('login-overlay').style.display = 'none';
        };
    });

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;

    function startApp() {
        startBtn.style.display = 'none';
        micBtn.style.display = 'block';
        liveBubble.style.display = 'block';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

        // 첫 인사말은 AI 호출 없이 항상 동일한 문장으로 고정 출력합니다.
        const opening = "Hi! My name is Luca. How are you?";
        stage = 'await_feeling';

        setTimeout(() => {
            addChatMessage('luca', opening);
            conversationHistory.push({ role: 'assistant', content: opening });
            speak(opening, () => {
                hint.innerText = "🎙️ 버튼을 누르고 루카에게 대답해보세요!";
            });
        }, 300);
    }

    function showKoreanPopup(text) {
        koreanPopup.innerText = "📢 " + text;
        koreanPopup.classList.add('show');
    }

    function hideKoreanPopup() {
        koreanPopup.classList.remove('show');
    }

    function addChatMessage(sender, text) {
        let formattedText = text.trim();
        if (sender === 'user' && formattedText.length > 0) {
            formattedText = formattedText.charAt(0).toUpperCase() + formattedText.slice(1);
        }
        const msgBubble = document.createElement('div');
        msgBubble.classList.add('msg', sender);
        msgBubble.innerText = formattedText;
        chatHistory.appendChild(msgBubble);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // 💡 이모티콘을 모두 잘라내고 텍스트만 읽는 함수 (Unicode 속성 기반이라 신규 이모지도 포함)
    // ※ 이 함수는 '루카가 말하는 대사(data.reply)'에만 사용됩니다.
    //   로그인 화면, 안내 문구, 버튼 등 다른 곳의 이모지는 그대로 유지됩니다.
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        liveBubble.innerText = text;
        
        // \p{Extended_Pictographic}: 사실상 모든 그림 이모지를 포괄
        // \p{Emoji_Presentation}, Regional_Indicator(국기), ZWJ(\u200D), 변형 선택자(\uFE0F),
        // 키캡(\u20E3), 피부톤 모디파이어까지 함께 제거합니다.
        const emojiPattern = /(\p{Extended_Pictographic}|\p{Emoji_Presentation}|\p{Regional_Indicator})(\u200D(\p{Extended_Pictographic}|\p{Emoji_Presentation}))*|\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]/gu;
        let cleanText = text.replace(emojiPattern, '').replace(/\s{2,}/g, ' ').trim();
        
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; 
        utterance.pitch = 1.45; 
        
        if (voices.length > 0) {
            const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google'))) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;
        }
        
        lucaWrapper.classList.add('talking');
        utterance.onend = () => {
            lucaWrapper.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utterance);
    }

    // 🔗 파이썬 백엔드 API와 실시간 대화 및 로그 적재 처리
    async function handleConversation(userInput) {
        // 직전 대화 맥락을 함께 보내야 Luca가 대화를 기억하고 자연스럽게 이어갑니다.
        conversationHistory.push({ role: 'user', content: userInput });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    student: studentInfo, 
                    message: userInput,
                    history: conversationHistory,
                    stage: stage
                })
            });

            const data = await response.json();

            conversationHistory.push({ role: 'assistant', content: data.reply });
            if (data.stage) stage = data.stage;

            addChatMessage('luca', data.reply); 
            // ⚠️ 팝업(data.popup)은 절대 speak()에 넘기지 않습니다 — 화면 표시 전용입니다.
            speak(data.reply, () => {
                hint.innerText = "🎙️ 버튼을 누르고 루카에게 대답해보세요!";
            }); 

            if (data.popup) {
                showKoreanPopup(data.popup);
            } else {
                hideKoreanPopup();
            }

        } catch (error) {
            console.error("백엔드 연결 실패:", error);
            addChatMessage('luca', "Sorry, I missed that. Can you say it again?");
            speak("Sorry, I missed that.");
        }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.onclick = () => {
            try {
                recognition.start();
                micBtn.classList.add('recording');
                hint.innerText = "Listening...👂 (듣고 있어요)";
            } catch (e) {}
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            addChatMessage('user', transcript);
            handleConversation(transcript);
        };

        recognition.onend = () => { micBtn.classList.remove('recording'); };
    } else {
        alert("크롬 브라우저를 사용해주세요!");
    }
</script>
</body>
</html>
