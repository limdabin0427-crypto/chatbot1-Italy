<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca - Talking Bot</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }

        /* 루카 캐릭터 스타일 */
        #luca-container {
            position: relative;
            width: 250px;
            height: 350px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        #luca-character {
            width: 100%;
            filter: drop-shadow(5px 5px 15px rgba(0,0,0,0.5));
        }

        /* 루카 말할 때 애니메이션 */
        .talking {
            animation: bounce 0.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 말풍선 */
        #bubble {
            position: absolute;
            top: -80px; left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 280px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent;
            transform: translateX(-50%);
        }

        /* 하단 컨트롤러 */
        #control-panel {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            text-align: center;
            color: white;
        }

        #hint {
            color: #FFEB3B;
            margin-bottom: 15px;
            font-size: 16px;
        }

        #mic-btn {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: none;
            background: #f44336;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
        }
        #mic-btn.recording {
            background: #4CAF50;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="luca-container">
        <div id="bubble"></div>
        <!-- 귀여운 소년 일러스트 (더미 이미지로 대체, 나중에 실제 이미지 링크로 교체 가능) -->
        <img id="luca-character" src="https://cdn-icons-png.flaticon.com/512/4140/4140037.png" alt="Luca">
    </div>

    <div id="control-panel">
        <div id="hint">화면의 마이크 버튼을 눌러보세요!</div>
        <button id="mic-btn">🎙️</button>
        <p id="recognized-text" style="font-size: 14px; opacity: 0.8;"></p>
    </div>

<script>
    const bubble = document.getElementById('bubble');
    const luca = document.getElementById('luca-container');
    const hint = document.getElementById('hint');
    const micBtn = document.getElementById('mic-btn');
    const recognizedText = document.getElementById('recognized-text');

    let step = 0;
    
    // 음성 합성 (말하기)
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        
        bubble.style.display = 'block';
        bubble.innerHTML = text;
        luca.classList.add('talking');
        
        utterance.onend = () => {
            luca.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utterance);
    }

    // 음성 인식 (듣기)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    micBtn.onclick = () => {
        recognition.start();
        micBtn.classList.add('recording');
        recognizedText.innerText = "Listening...";
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        recognizedText.innerText = `You said: "${transcript}"`;
        handleConversation(transcript);
    };

    recognition.onend = () => {
        micBtn.classList.remove('recording');
    };

    // 대화 로직
    function handleConversation(input) {
        if (step === 1) {
            if (input.includes("yes")) {
                speak("Oh! I like Pizza too! It's good!", () => {
                    nextStep("Now, ask me: Do you like Kimbap?", "루카에게 김밥을 좋아하는지 물어보세요!");
                });
            } else {
                speak("Oh, Okay!", () => {
                    nextStep("Now, ask me: Do you like Kimbap?", "루카에게 김밥을 좋아하는지 물어보세요!");
                });
            }
            step = 2;
        } else if (step === 2 && input.includes("kimbap")) {
            speak("Yes, I do. I like Kimbap. Do you like Kimbap?", () => {
                hint.innerText = "Yes나 No로 대답해보세요!";
            });
            step = 3;
        } else if (step === 3) {
            speak("Oh, great! Come to Italy! Bye Bye!", () => {
                hint.innerText = "대화가 끝났습니다. 다시 하려면 새로고침 하세요.";
            });
        }
    }

    function nextStep(text, hintText) {
        setTimeout(() => {
            speak(text);
            hint.innerText = hintText;
        }, 1000);
    }

    // 시작
    window.onload = () => {
        setTimeout(() => {
            speak("Ciao! My name is Luca! Nice to meet you. Do you like Pizza?", () => {
                hint.innerText = "Yes, I do 또는 No, I don't라고 말해보세요.";
            });
            step = 1;
        }, 1000);
    };
</script>
</body>
</html>
