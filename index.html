<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luca - Elementary Small Talk Bot</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e24;
            display: flex; justify-content: center; align-items: center;
        }
        #app-container {
            width: 100%; max-width: 450px; height: 100%;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .bg-slideshow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .bg-slideshow::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 20, 0.35); z-index: 2;
        }
        .bg-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; animation: slideFade 24s infinite ease-in-out;
        }
        .slide1 { background-image: url('italy background 1.gif'); animation-delay: 0s; }
        .slide2 { background-image: url('italy background 2.gif'); animation-delay: 6s; }
        .slide3 { background-image: url('italy background 3.gif'); animation-delay: 12s; }
        .slide4 { background-image: url('italy background 4.gif'); animation-delay: 18s; }
        @keyframes slideFade {
            0% { opacity: 0; } 4% { opacity: 1; } 25% { opacity: 1; } 29% { opacity: 0; } 100% { opacity: 0; }
        }
        #character-area {
            position: relative; width: 100%; height: 35vh; min-height: 220px;
            display: flex; justify-content: center; align-items: flex-end;
            z-index: 3; perspective: 1000px; padding-top: 20px;
        }
        #italy-flag-img {
            position: absolute; top: 15px; left: 15px; width: 50px; height: auto;
            border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 4;
        }
        #luca-wrapper {
            position: relative; width: 140px; height: 180px;
            transform-style: preserve-3d; animation: idle3D 4s ease-in-out infinite alternate;
        }
        @keyframes idle3D {
            0% { transform: rotateY(-5deg) translateY(0px); }
            100% { transform: rotateY(5deg) translateY(-6px); }
        }
        #luca-character { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }
        .talking #luca-character { animation: bodyTalk 0.4s infinite alternate; }
        @keyframes bodyTalk { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        #live-bubble {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
            padding: 12px 18px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 55%; max-width: 240px; text-align: center; font-size: 18px; font-weight: 700; color: #1d1d1f;
            z-index: 5; word-break: keep-all; pointer-events: none; display: none;
        }
        #live-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: rgba(255,255,255,0.96) transparent;
        }
        #chat-history {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            z-index: 3; box-sizing: border-box;
            background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #chat-history::-webkit-scrollbar { display: none; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .msg.luca { align-self: flex-start; background: #ffffff; color: #1d1d1f; border-top-left-radius: 2px; }
        .msg.user { align-self: flex-end; background: #00b09b; color: #ffffff; border-top-right-radius: 2px; }
        #control-panel {
            background: rgba(20,20,25,0.92); padding: 20px; text-align: center; color: white;
            box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #hint { color: #FFEB3B; font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
        #mic-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; font-size: 28px; cursor: pointer;
            box-shadow: 0 6px 15px rgba(255,65,108,0.4); transition: all 0.2s; display: none;
        }
        #mic-btn.recording { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 0 25px rgba(56,239,125,0.7); animation: pulse 1.4s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        #start-btn {
            padding: 14px 45px; font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #00b09b, #96c93d); color: white; border: none;
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,176,155,0.4);
        }

        /* 한글 팝업 */
        #korean-popup {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: #FFE066; color: #4a3700; padding: 12px 20px; border-radius: 16px;
            font-size: 14px; font-weight: 700; max-width: 82%; text-align: center; line-height: 1.4;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3); z-index: 8;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #korean-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 🎆 피날레 오버레이 */
        #finale-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.78); z-index: 9998;
            justify-content: center; align-items: center;
        }
        #finale-overlay.show { display: flex; }
        #finale-msg {
            background: linear-gradient(135deg, #fff9e6, #ffffff);
            color: #2a2a2a; padding: 32px 28px; border-radius: 24px;
            font-size: 20px; font-weight: 800; text-align: center; line-height: 1.7;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4); max-width: 310px;
            border: 3px solid #FFD700; z-index: 9999;
        }
        /* 폭죽 파티클 */
        .spark {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9997;
            animation: sparkFly 1.3s ease-out forwards;
        }
        @keyframes sparkFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;justify-content:center;align-items:center;">
        <div style="background:white;padding:30px;border-radius:15px;text-align:center;max-width:320px;width:85%;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
            <h3 style="margin-top:0;color:#222;font-size:20px;">🇮🇹 루카 챗봇 시작하기</h3>
            <p style="font-size:14px;color:#666;line-height:1.4;">반갑습니다! 수업 기록을 위해<br><b>학번과 이름</b>을 입력해주세요.<br>(예: 30101 홍길동)</p>
            <input type="text" id="student-name-input" placeholder="예: 3101 김민지" style="width:90%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:8px;text-align:center;font-size:16px;">
            <button id="login-submit-btn" style="background:#00935b;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;width:98%;font-weight:bold;">등록하기 🚀</button>
        </div>
    </div>

    <!-- 🎆 피날레 오버레이 -->
    <div id="finale-overlay">
        <div id="finale-msg">
            🎉 이탈리아 친구와<br>대화해보다니!<br><br>참 잘했어요! 👏<br><br>다음 나라로 이동하세요.
        </div>
    </div>

    <div id="app-container">
        <div class="bg-slideshow">
            <div class="bg-slide slide1"></div>
            <div class="bg-slide slide2"></div>
            <div class="bg-slide slide3"></div>
            <div class="bg-slide slide4"></div>
        </div>
        <div id="character-area">
            <img id="italy-flag-img" src="italy flag.gif" alt="Italy Flag">
            <div id="korean-popup"></div>
            <div id="live-bubble">Click START! 👇</div>
            <div id="luca-wrapper">
                <img id="luca-character" src="OIP_Luca_paguro_png.PNG" alt="Luca">
            </div>
        </div>
        <div id="chat-history"></div>
        <div id="control-panel">
            <div id="hint">Let's chat with Luca!</div>
            <button id="start-btn" onclick="startApp()">START (ITALY)</button>
            <button id="mic-btn">🎙️</button>
        </div>
    </div>

<script>
    const liveBubble    = document.getElementById('live-bubble');
    const koreanPopup   = document.getElementById('korean-popup');
    const lucaWrapper   = document.getElementById('luca-wrapper');
    const chatHistory   = document.getElementById('chat-history');
    const hint          = document.getElementById('hint');
    const startBtn      = document.getElementById('start-btn');
    const micBtn        = document.getElementById('mic-btn');
    const finaleOverlay = document.getElementById('finale-overlay');

    let voices = [];
    let studentInfo = "";
    let conversationHistory = [];
    let stage = 'await_greeting';

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-submit-btn').onclick = () => {
            const val = document.getElementById('student-name-input').value.trim();
            if (!val) { alert("학번과 이름을 꼭 적어주세요! 😊"); return; }
            studentInfo = val;
            document.getElementById('login-overlay').style.display = 'none';
        };
    });

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined)
        window.speechSynthesis.onvoiceschanged = loadVoices;

    // ── 앱 시작 ──────────────────────────────────────────────
    function startApp() {
        startBtn.style.display = 'none';
        micBtn.style.display   = 'block';
        liveBubble.style.display = 'block';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

        stage = 'await_greeting';
        const opening = "Hi! My name is Luca. Nice to meet you.";

        setTimeout(() => {
            addChatMessage('luca', opening);
            conversationHistory.push({ role: 'assistant', content: opening });
            speak(opening, () => {
                hint.innerText = "🎙️ 버튼을 누르고 루카에게 대답해보세요!";
                showKoreanPopup("루카에게 인사를 영어로 해주세요.");
            });
        }, 300);
    }

    // ── 팝업 ─────────────────────────────────────────────────
    function showKoreanPopup(text) {
        koreanPopup.innerText = "📢 " + text;
        koreanPopup.classList.add('show');
    }
    function hideKoreanPopup() {
        koreanPopup.classList.remove('show');
    }

    // ── 채팅 메시지 추가 ──────────────────────────────────────
    function addChatMessage(sender, text) {
        let t = text.trim();
        if (sender === 'user' && t.length > 0)
            t = t.charAt(0).toUpperCase() + t.slice(1);
        const el = document.createElement('div');
        el.classList.add('msg', sender);
        el.innerText = t;
        chatHistory.appendChild(el);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // ── TTS ───────────────────────────────────────────────────
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        liveBubble.innerText = text;
        const emojiPat = /(\p{Extended_Pictographic}|\p{Emoji_Presentation}|\p{Regional_Indicator})(\u200D(\p{Extended_Pictographic}|\p{Emoji_Presentation}))*|\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]/gu;
        const clean = text.replace(emojiPat, '').replace(/\s{2,}/g, ' ').trim();
        const utt = new SpeechSynthesisUtterance(clean);
        utt.lang  = 'en-US';
        utt.rate  = 0.8;
        utt.pitch = 1.45;
        if (voices.length > 0) {
            const v = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google')))
                   || voices.find(v => v.lang.startsWith('en'));
            if (v) utt.voice = v;
        }
        lucaWrapper.classList.add('talking');
        utt.onend = () => {
            lucaWrapper.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utt);
    }

    // ── 🎆 폭죽 터뜨리기 ──────────────────────────────────────
    function launchFireworks() {
        const colors = ['#FF4136','#FF851B','#FFDC00','#2ECC40','#0074D9','#B10DC9','#FF69B4','#fff'];
        const count  = 120;
        const cx     = window.innerWidth  / 2;
        const cy     = window.innerHeight / 2;
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('div');
            spark.classList.add('spark');
            const angle = Math.random() * 2 * Math.PI;
            const dist  = 120 + Math.random() * 280;
            const tx    = Math.cos(angle) * dist;
            const ty    = Math.sin(angle) * dist;
            const size  = 6 + Math.random() * 10;
            spark.style.cssText = `
                left: ${cx}px; top: ${cy}px;
                width: ${size}px; height: ${size}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                --tx: ${tx}px; --ty: ${ty}px;
                animation-delay: ${Math.random() * 0.4}s;
                animation-duration: ${0.9 + Math.random() * 0.6}s;
            `;
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 2000);
        }
        // 여러 번 터뜨리기
        setTimeout(() => launchBurst(cx * 0.4, cy * 0.6, colors), 400);
        setTimeout(() => launchBurst(cx * 1.6, cy * 0.5, colors), 700);
        setTimeout(() => launchBurst(cx,        cy * 1.3, colors), 1000);
    }

    function launchBurst(x, y, colors) {
        for (let i = 0; i < 50; i++) {
            const spark = document.createElement('div');
            spark.classList.add('spark');
            const angle = Math.random() * 2 * Math.PI;
            const dist  = 60 + Math.random() * 160;
            spark.style.cssText = `
                left: ${x}px; top: ${y}px;
                width: ${5 + Math.random()*8}px; height: ${5 + Math.random()*8}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                --tx: ${Math.cos(angle)*dist}px; --ty: ${Math.sin(angle)*dist}px;
                animation-delay: ${Math.random()*0.3}s;
                animation-duration: ${0.8 + Math.random()*0.5}s;
            `;
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 2000);
        }
    }

    // ── 피날레 실행 ───────────────────────────────────────────
    function showFinale() {
        launchFireworks();
        setTimeout(() => launchFireworks(), 800);
        setTimeout(() => launchFireworks(), 1600);
        setTimeout(() => {
            finaleOverlay.classList.add('show');
        }, 600);
    }

    // ── 백엔드 API 호출 ───────────────────────────────────────
    async function handleConversation(userInput) {
        conversationHistory.push({ role: 'user', content: userInput });
        try {
            const res  = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student: studentInfo,
                    message: userInput,
                    history: conversationHistory,
                    stage:   stage
                })
            });
            const data = await res.json();

            conversationHistory.push({ role: 'assistant', content: data.reply });
            if (data.stage) stage = data.stage;

            addChatMessage('luca', data.reply);

            if (data.popup) showKoreanPopup(data.popup);
            else            hideKoreanPopup();

            // 폭죽 신호가 왔으면 TTS 끝난 후 피날레 실행
            if (data.fireworks) {
                speak(data.reply, () => {
                    hint.innerText = "수고했어요! 🎉";
                    micBtn.style.display = 'none';
                    showFinale();
                });
            } else {
                speak(data.reply, () => {
                    hint.innerText = "🎙️ 버튼을 누르고 루카에게 대답해보세요!";
                });
            }

        } catch (err) {
            console.error("백엔드 연결 실패:", err);
            addChatMessage('luca', "Sorry, I missed that. Can you say it again?");
            speak("Sorry, I missed that.");
        }
    }

    // ── 음성 인식 ─────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.onclick = () => {
            try {
                recognition.start();
                micBtn.classList.add('recording');
                hint.innerText = "Listening...👂 (듣고 있어요)";
            } catch(e) {}
        };
        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            addChatMessage('user', transcript);
            handleConversation(transcript);
        };
        recognition.onend = () => { micBtn.classList.remove('recording'); };
    } else {
        alert("크롬 브라우저를 사용해주세요!");
    }
</script>
</body>
</html>
