<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luca - Premium Talking Bot</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }

        #main-stage {
            position: relative;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }

        #main-stage::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
            z-index: 1; pointer-events: none;
        }

        /* 3D 루카 배치 공간 (화면 높이에 맞춰 유연하게 조절되도록 세팅) */
        #luca-container {
            position: absolute;
            bottom: 210px; /* 컨트롤 패널 및 말풍선 공간 위로 캐릭터 배치 */
            width: 260px;
            height: 45vh; /* 화면 높이의 45%만 차지하도록 유연하게 변경 */
            display: flex; justify-content: center; align-items: flex-end;
            transform-style: preserve-3d;
            animation: idle3D 4s ease-in-out infinite alternate;
            z-index: 2;
        }
        @keyframes idle3D {
            0% { transform: rotateY(-4deg) translateY(0px); }
            100% { transform: rotateY(4deg) translateY(-8px); }
        }

        #luca-character {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.4));
        }

        .talking #luca-character { animation: bodyTalk 0.4s infinite alternate; }
        @keyframes bodyTalk { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }

        /* 🎛️ 하단 컨트롤러 영역 (검정 칸을 기준으로 말풍선을 쌓기 위해 컨테이너 성격 부여) */
        #control-panel {
            position: relative;
            width: 92%; max-width: 440px;
            background: rgba(20, 20, 25, 0.82); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 22px 20px; margin-bottom: 20px; text-align: center; color: white; 
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); box-sizing: border-box; 
            z-index: 10;
        }

        /* 💬 [절대 겹침 방지] 검정 박스 상단에 자석처럼 매달려 있는 구조의 말풍선 */
        #bubble {
            position: absolute; 
            bottom: calc(100% + 15px); /* 검정 박스 맨 윗부분에서 무조건 15px 위에 배치 */
            left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); /* 조금 더 선명한 흰색으로 루카 몸과 겹쳐도 글씨 가독성 확보 */
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 16px 22px; border-radius: 22px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
            width: 90%; max-width: 340px;
            text-align: center; font-size: 22px; line-height: 1.4; font-weight: 700; color: #1d1d1f; 
            word-break: keep-all; 
            z-index: 15; /* 루카 캐릭터보다 무조건 앞에 뜨도록 레이어 상향 */
            pointer-events: none; 
        }
        /* 말풍선 아래쪽 화살표 고정 */
        #bubble::after {
            content: ''; position: absolute; 
            bottom: -12px; left: 50%; transform: translateX(-50%);
            border-width: 12px 12px 0; border-style: solid; 
            border-color: rgba(255, 255, 255, 0.96) transparent;
        }

        /* 🇮🇹 이탈리아 국기 배지 */
        #flag-container {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 26px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #008C45 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #CD212A 66.6%);
            border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.2);
        }

        #hint { color: #f5f5f7; margin-top: 10px; margin-bottom: 18px; font-size: 16px; font-weight: 500; opacity: 0.9; }
        
        #mic-btn {
            width: 76px; height: 76px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: white; font-size: 30px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: none; margin: 0 auto;
        }
        #mic-btn:active { transform: scale(0.92); }
        #mic-btn.recording { 
            background: linear-gradient(135deg, #11998e, #38ef7d); 
            box-shadow: 0 0 30px rgba(56, 239, 125, 0.8); animation: pulse 1.4s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #start-btn {
            padding: 14px 45px; font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, #00b09b, #96c93d); color: white; border: none;
            border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 176, 155, 0.4); transition: all 0.3s;
        }
        #start-btn:active { transform: scale(0.95); }

        #recognized-text { font-size: 14px; color: #a1a1a6; margin-top: 12px; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>

    <div id="main-stage">
        <div id="luca-container">
            <img id="luca-character" src="OIP_Luca_paguro_png.PNG" alt="Luca">
        </div>

        <div id="control-panel">
            <div id="bubble">Click START! 👇</div>
            
            <div id="flag-container"></div>
            <div id="hint">Let's talk with Luca!</div>
            <button id="start-btn" onclick="startApp()">START</button>
            <button id="mic-btn">🎙️</button>
            <p id="recognized-text"></p>
        </div>
    </div>

<script>
    const bubble = document.getElementById('bubble');
    const lucaContainer = document.getElementById('luca-container');
    const hint = document.getElementById('hint');
    const startBtn = document.getElementById('start-btn');
    const micBtn = document.getElementById('mic-btn');
    const recognizedText = document.getElementById('recognized-text');

    let step = 0;
    let voices = [];

    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }
    
    function startApp() {
        startBtn.style.display = 'none';
        micBtn.style.display = 'block';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

        setTimeout(() => {
            speak("Ciao! My name is Luca! Nice to meet you. Do you like Pizza?", () => {
                hint.innerText = "🎙️ 버튼을 누르고 대답해보세요!";
                recognizedText.innerText = '추천 대답: "Yes, I do." 또는 "No, I don\'t."';
            });
            step = 1;
        }, 300);
    }

    function speak(text, callback) {
        window.speechSynthesis.cancel(); 
        bubble.innerHTML = text;
        
        const utterance = new SpeechSynthesisUtterance(text.replace(/<br>/g, " "));
        utterance.lang = 'en-US';
        utterance.rate = 0.8; 
        utterance.pitch = 1.45; 
        
        if (voices.length > 0) {
            const preferredVoice = voices.find(v => 
                v.lang.startsWith('en') && 
                (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('natural') || v.name.toLowerCase().includes('google'))
            ) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) {
                utterance.voice = preferredVoice;
                if (preferredVoice.name.toLowerCase().includes('female')) {
                    utterance.pitch = 1.15; 
                }
            }
        }
        
        lucaContainer.classList.add('talking');
        utterance.onend = () => {
            lucaContainer.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utterance);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.onclick = () => {
            try {
                recognition.start();
                micBtn.classList.add('recording');
                recognizedText.innerText = "Listening...👂 (듣고 있어요)";
            } catch (e) {}
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            recognizedText.innerHTML = `내가 한 말: <span style="color:#38ef7d; font-weight:700;">"${transcript}"</span>`;
            handleConversation(transcript);
        };
        recognition.onend = () => { micBtn.classList.remove('recording'); };
    }

    function handleConversation(input) {
        if (step === 1) {
            if (input.includes("yes")) {
                speak("Oh! I like Pizza too! It's good!", () => {
                    nextStep("Now, ask me: Do you like ice cream?", "루카에게 아이스크림을 좋아하는지 물어보세요!");
                    recognizedText.innerText = '추천 질문: "Do you like ice cream?"';
                });
            } else {
                speak("Oh, Okay!", () => {
                    nextStep("Now, ask me: Do you like ice cream?", "루카에게 아이스크림을 좋아하는지 물어보세요!");
                    recognizedText.innerText = '추천 질문: "Do you like ice cream?"';
                });
            }
            step = 2;
        } else if (step === 2 && (input.includes("ice") || input.includes("cream"))) {
            speak("Yes, I do. I like ice cream. Do you like ice cream?", () => {
                hint.innerText = "🎙️ 버튼을 누르고 대답해보세요!";
                recognizedText.innerText = '추천 대답: "Yes, I do." 또는 "No, I don\'t."';
            });
            step = 3;
        } else if (step === 2) {
            speak("Can you ask me 'Do you like ice cream?'", () => {
                hint.innerText = "🎙️ 버튼을 누르고 다시 한 번 물어봐주세요.";
            });
        } else if (step === 3) {
            speak("Oh, great! Come to Italy! Bye Bye!", () => {
                hint.innerText = "🎉 참 잘했어요! 대화가 끝났습니다.";
                recognizedText.innerText = "";
            });
            step = 4;
        }
    }

    function nextStep(text, hintText) {
        setTimeout(() => {
            speak(text);
            hint.innerText = hintText;
        }, 1200);
    }
</script>
</body>
</html>
