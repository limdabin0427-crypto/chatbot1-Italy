<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca와 대화하기</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Nanum Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 이탈리아 베네치아 풍경 배경 */
            background: url('https://images.unsplash.com/photo-1514890547357-a9ee2887ad8e?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        #chat-container {
            width: 90%;
            max-width: 400px;
            height: 600px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background-color: #008C45; /* 이탈리아 국기 초록색 */
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.4;
            position: relative;
        }

        .luca-msg {
            align-self: flex-start;
            background-color: #f1f0f0;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #CD212A; /* 이탈리아 국기 빨간색 */
            color: white;
            border-bottom-right-radius: 2px;
        }

        .hint-box {
            background-color: #fff3cd;
            border: 1px dashed #ffeeba;
            color: #856404;
            padding: 8px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        #input-area {
            padding: 15px;
            background: white;
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #008C45;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span>🇮🇹 Talk with Luca</span>
    </div>
    <div id="chat-window">
        <!-- 메시지가 여기에 표시됩니다 -->
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type here..." onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    let step = 0;

    // 루카의 메시지 출력 함수
    function addLucaMessage(text, hint = "") {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message luca-msg';
        msgDiv.innerHTML = `<strong>Luca</strong><br>${text}`;
        chatWindow.appendChild(msgDiv);

        if (hint) {
            const hintDiv = document.createElement('div');
            hintDiv.className = 'hint-box';
            hintDiv.innerText = `💡 ${hint}`;
            chatWindow.appendChild(hintDiv);
        }
        
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // 학생의 메시지 출력 함수
    function addUserMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message user-msg';
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // 첫 인사 시작
    setTimeout(() => {
        addLucaMessage("Ciao! My name is Luca! Nice to meet you. <br>Do you like Pizza?", "Yes나 No로 대답해보세요. (예: Yes, I do.)");
        step = 1;
    }, 500);

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;

        addUserMessage(text);
        userInput.value = "";

        // 대화 로직
        setTimeout(() => {
            if (step === 1) {
                if (text.toLowerCase().includes("yes")) {
                    addLucaMessage("Oh! I like Pizza too! It's good!");
                } else {
                    addLucaMessage("Oh, Okay!");
                }
                
                setTimeout(() => {
                    addLucaMessage("Now, it's your turn!", "루카에게 김밥을 좋아하는지 영어로 물어보세요. (Do you like Kimbap?)");
                    step = 2;
                }, 1000);

            } else if (step === 2) {
                if (text.toLowerCase().includes("do you like kimbap")) {
                    addLucaMessage("Yes, I do. I like Kimbap.");
                    setTimeout(() => {
                        addLucaMessage("Do you like Kimbap?", "여러분의 대답을 입력해보세요! (Yes, I do. 또는 No, I don't.)");
                        step = 3;
                    }, 1000);
                } else {
                    addLucaMessage("Sorry? Can you ask 'Do you like Kimbap?'", "영어로 물어봐주세요: Do you like Kimbap?");
                }

            } else if (step === 3) {
                addLucaMessage("Oh, great! Come to Italy! Bye Bye! 👋");
                step = 4;
            }
        }, 1000);
    }
</script>

</body>
</html>
