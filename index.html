<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luca - Elementary Small Talk Bot</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e24;
            display: flex; justify-content: center; align-items: center;
        }

        #app-container {
            width: 100%; max-width: 450px; height: 100%;
            background: url('https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #app-container::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(20, 20, 25, 0.4); z-index: 1; pointer-events: none;
        }

        #character-area {
            position: relative; width: 100%; height: 35vh; min-height: 220px;
            display: flex; justify-content: center; align-items: flex-end; z-index: 2;
            perspective: 1000px; padding-top: 20px;
        }

        /* 🇮🇹 이탈리아 감성 일러스트 데코레이션 요소 정의 */
        .italy-deco {
            position: absolute;
            font-size: 32px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            user-select: none;
            z-index: 2;
            bottom: 25px;
            animation: decoFloat 3s ease-in-out infinite alternate;
        }
        @keyframes decoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
        /* 왼쪽 장식 (국기, 젤라또) */
        .deco-flag { left: 15px; bottom: 85px; font-size: 36px; animation-delay: 0s; }
        .deco-gelato { left: 25px; bottom: 25px; font-size: 34px; animation-delay: 0.5s; }
        /* 오른쪽 장식 (오토바이, 피사의 사탑) */
        .deco-scooter { right: 25px; bottom: 25px; font-size: 34px; animation-delay: 1s; }
        .deco-tower { right: 15px; bottom: 85px; font-size: 38px; animation-delay: 1.5s; }

        #luca-wrapper {
            position: relative; width: 140px; height: 180px;
            transform-style: preserve-3d; animation: idle3D 4s ease-in-out infinite alternate;
            z-index: 3;
        }
        @keyframes idle3D {
            0% { transform: rotateY(-5deg) translateY(0px); }
            100% { transform: rotateY(5deg) translateY(-6px); }
        }
        #luca-character { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
        .talking #luca-character { animation: bodyTalk 0.4s infinite alternate; }
        @keyframes bodyTalk { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        #live-bubble {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
            padding: 12px 18px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 75%; max-width: 280px; text-align: center; font-size: 18px; font-weight: 700; color: #1d1d1f;
            z-index: 5; word-break: keep-all; pointer-events: none; display: none;
        }
        #live-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.96) transparent;
        }

        #chat-history {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            z-index: 2; box-sizing: border-box;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
        }
        #chat-history::-webkit-scrollbar { display: none; }

        .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 16px; font-weight: 600; line-height: 1.4; word-break: break-word; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .msg.luca { align-self: flex-start; background: #ffffff; color: #1d1d1f; border-top-left-radius: 2px; }
        .msg.user { align-self: flex-end; background: #00b09b; color: #ffffff; border-top-right-radius: 2px; }

        #control-panel {
            background: rgba(20, 20, 25, 0.9); padding: 20px; text-align: center; color: white;
            box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #hint { color: #FFEB3B; font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
        
        #mic-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; font-size: 28px; cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4); transition: all 0.2s; display: none;
        }
        #mic-btn.recording { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 0 25px rgba(56, 239, 125, 0.7); animation: pulse 1.4s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #start-btn {
            padding: 14px 45px; font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #00b09b, #96c93d); color: white; border: none;
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(0, 176, 155, 0.4);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="character-area">
            <!-- 이탈리아 감성 일러스트 요소 배치 -->
            <div class="italy-deco deco-flag">🇮🇹</div>
            <div class="italy-deco deco-gelato">🍦</div>
            
            <div id="live-bubble">Click START! 👇</div>
            <div id="luca-wrapper">
                <img id="luca-character" src="OIP_Luca_paguro_png.PNG" alt="Luca">
            </div>

            <div class="italy-deco deco-scooter">🛵</div>
            <div class="italy-deco deco-tower">🗼</div>
        </div>

        <div id="chat-history"></div>

        <div id="control-panel">
            <div id="hint">Let's chat with Luca!</div>
            <button id="start-btn" onclick="startApp()">START 🇮🇹</button>
            <button id="mic-btn">🎙️</button>
        </div>
    </div>

<script>
    const liveBubble = document.getElementById('live-bubble');
    const lucaWrapper = document.getElementById('luca-wrapper');
    const chatHistory = document.getElementById('chat-history');
    const hint = document.getElementById('hint');
    const startBtn = document.getElementById('start-btn');
    const micBtn = document.getElementById('mic-btn');

    let voices = [];
    let step = 0; // 대화 단계를 추적하는 변수
    let studentName = ""; // 학생 이름을 기억할 변수

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;

    // 대화 시작 버튼 클릭 시 (Step 0)
    function startApp() {
        startBtn.style.display = 'none';
        micBtn.style.display = 'block';
        liveBubble.style.display = 'block';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

        setTimeout(() => {
            step = 0;
            const greeting = "Ciao! Hello!";
            addChatMessage('luca', greeting);
            speak(greeting, () => { 
                hint.innerText = "🎙️ 루카에게 'Hi' 또는 'Hello'라고 인사해보세요!"; 
            });
        }, 300);
    }

    // 말풍선 추가 및 첫 글자 대문자 변환 로직 반영
    function addChatMessage(sender, text) {
        let formattedText = text.trim();
        
        // 사용자가 말한 경우 문장의 첫 글자를 대문자로 변환
        if (sender === 'user' && formattedText.length > 0) {
            formattedText = formattedText.charAt(0).toUpperCase() + formattedText.slice(1);
        }

        const msgBubble = document.createElement('div');
        msgBubble.classList.add('msg', sender);
        msgBubble.innerText = formattedText;
        chatHistory.appendChild(msgBubble);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function speak(text, callback) {
        window.speechSynthesis.cancel();
        liveBubble.innerText = text;
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; // 느리고 친절한 속도
        utterance.pitch = 1.45; // 소년 변신 헬륨 트릭
        
        if (voices.length > 0) {
            const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google'))) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;
        }
        
        lucaWrapper.classList.add('talking');
        utterance.onend = () => {
            lucaWrapper.classList.remove('talking');
            if (callback) callback();
        };
        window.speechSynthesis.speak(utterance);
    }

    // 💬 [핵심 대화 로직] 정해진 시나리오대로 오작동 없이 흐르는 로직
    function handleConversation(input) {
        // 아이들의 다양한 영어 발음을 캐치하기 위해 소문자 공백 제거 처리
        const cleanInput = input.toLowerCase().trim();

        // 0단계: 인사를 받았을 때 -> 이름 묻기
        if (step === 0) {
            if (cleanInput.includes("hi") || cleanInput.includes("hello")) {
                step = 1;
                setTimeout(() => {
                    const nextText = "I'm Luca. What's your name?";
                    addChatMessage('luca', nextText);
                    speak(nextText, () => {
                        hint.innerText = "🎙️ 'My name is oo' 또는 'I'm oo'라고 이름을 말해보세요.";
                    });
                }, 1000);
            } else {
                speak("Say Hi or Hello!", () => {
                    hint.innerText = "🎙️ 다시 한 번 'Hi' 또는 'Hello'라고 해보세요!";
                });
            }
        } 
        
        // 1단계: 이름을 말했을 때 -> 이탈리아 소개 및 피자 질문
        else if (step === 1) {
            // "my name is", "i am", "i'm" 패턴 분석 후 순수한 이름만 추출 시도
            let detectedName = "my friend";
            if (cleanInput.includes("my name is")) {
                detectedName = input.substring(input.toLowerCase().indexOf("is") + 2).trim();
            } else if (cleanInput.includes("i am")) {
                detectedName = input.substring(input.toLowerCase().indexOf("am") + 2).trim();
            } else if (cleanInput.includes("i'm") || cleanInput.includes("im")) {
                const index = input.toLowerCase().includes("i'm") ? input.toLowerCase().indexOf("i'm") + 3 : input.toLowerCase().indexOf("im") + 2;
                detectedName = input.substring(index).trim();
            } else {
                // 패턴 없이 그냥 이름 단어만 말한 경우
                detectedName = input.trim();
            }
            
            // 첫 글자 대문자화
            studentName = detectedName.charAt(0).toUpperCase() + detectedName.slice(1);
            
            step = 2;
            setTimeout(() => {
                const nextText = `Nice to meet you, ${studentName}! I'm from Italy. Do you like pizza?`;
                addChatMessage('luca', nextText);
                speak(nextText, () => {
                    hint.innerText = "🎙️ 'Yes, I do.' 또는 'No, I don't.'라고 답해보세요.";
                });
            }, 1000);
        } 
        
        // 2단계: 피자 답변을 했을 때 -> 아이스크림 역질문 유도
        else if (step === 2) {
            let replyText = "";
            if (cleanInput.includes("yes")) {
                replyText = "Oh, I like pizza too! It's so good!";
            } else {
                replyText = "Oh, okay! Pizza is not your favorite.";
            }

            step = 3;
            setTimeout(() => {
                addChatMessage('luca', replyText);
                speak(replyText, () => {
                    // 바로 이어서 아이스크림 질문하도록 유도
                    setTimeout(() => {
                        const askMe = "Now, ask me: Do you like ice cream?";
                        addChatMessage('luca', askMe);
                        speak(askMe, () => {
                            hint.innerText = "🎙️ 루카에게 'Do you like ice cream?'이라고 질문해 보세요!";
                        });
                    }, 1000);
                });
            }, 500);
        } 
        
        // 3단계: 아이스크림 질문을 받았을 때 -> 최종 마무리 답변
        else if (step === 3) {
            if (cleanInput.includes("ice") || cleanInput.includes("cream") || cleanInput.includes("like")) {
                step = 4;
                setTimeout(() => {
                    const finalReply = "Yes, I do! I love ice cream! Come to Italy! Bye Bye!";
                    addChatMessage('luca', finalReply);
                    speak(finalReply, () => {
                        hint.innerText = "🎉 대화 성공! 참 잘했어요!";
                        micBtn.style.display = 'none'; // 대화 끝났으므로 마이크 숨김
                    });
                }, 1000);
            } else {
                speak("Can you ask me: Do you like ice cream?", () => {
                    hint.innerText = "🎙️ 'Do you like ice cream?'이라고 소리 내어 물어봐 주세요.";
                });
            }
        }
    }

    // STT 음성 인식 엔진 세팅
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.onclick = () => {
            try {
                recognition.start();
                micBtn.classList.add('recording');
                hint.innerText = "Listening...👂 (듣고 있어요)";
            } catch (e) {}
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            
            // 학생 말을 화면에 버블로 표시 (addChatMessage 내부에서 첫글자 대문자화 자동 처리)
            addChatMessage('user', transcript);
            
            // 시나리오 판단 함수로 전송
            handleConversation(transcript);
        };

        recognition.onend = () => { micBtn.classList.remove('recording'); };
    } else {
        alert("크롬 브라우저를 사용해주세요!");
    }
</script>
</body>
</html>
